name: CI - Tests & Build

on:
  push:
    branches: ['**']  # Tous les branches
  pull_request:
    branches: [main, develop]

jobs:
  # Backend Tests
  backend-tests:
    name: Backend - Tests & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: flotteq_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Verify database migrations from an empty PostgreSQL database
        working-directory: ./backend
        run: |
          createdb -h localhost -U postgres flotteq_migrations_test
          npm run migration:run
        env:
          PGPASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: test_password
          DB_NAME: flotteq_migrations_test
          NODE_ENV: test

      - name: Lint code
        working-directory: ./backend
        run: npm run lint:check

      - name: Run unit tests
        working-directory: ./backend
        run: npm test -- --runInBand
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: test_password
          DB_NAME: flotteq_test
          JWT_ACCESS_SECRET: test_access_secret_min_32_chars_for_testing_only
          JWT_REFRESH_SECRET: test_refresh_secret_min_32_chars_for_testing_only
          JWT_PARTNER_SECRET: test_partner_secret_min_32_chars_for_testing_only
          NODE_ENV: test

      - name: Setup test database from production migrations
        working-directory: ./backend
        run: npm run migration:run
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: test_password
          DB_NAME: flotteq_test
          NODE_ENV: test

      - name: Run E2E tests
        working-directory: ./backend
        run: npm run test:e2e -- --forceExit
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: test_password
          DB_NAME: flotteq_test
          JWT_ACCESS_SECRET: test_access_secret_min_32_chars
          JWT_REFRESH_SECRET: test_refresh_secret_min_32_chars
          JWT_PARTNER_SECRET: test_partner_secret_min_32_chars
          STRIPE_SECRET_KEY: sk_test_dummy_key_for_ci_tests_only
          STRIPE_WEBHOOK_SECRET: whsec_test_dummy_webhook_secret
          REDIS_ENABLED: "true"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PREFIX: ci-${{ github.run_id }}
          NODE_ENV: test

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 7

  # Frontend Client Tests & Build
  frontend-client-build:
    name: Frontend Client - Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-client/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend-client
        run: npm ci

      - name: Lint
        working-directory: ./frontend-client
        run: npm run lint

      - name: Run tests
        working-directory: ./frontend-client
        run: npm test -- --run
        env:
          VITE_API_URL: http://localhost:3000/api

      - name: Build
        working-directory: ./frontend-client
        run: npm run build
        env:
          VITE_API_BASE: https://api.flotteq.fr
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_dummy_for_build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-client-dist
          path: frontend-client/dist
          retention-days: 7

  # Frontend Partner Build
  frontend-partner-build:
    name: Frontend Partner - Tests & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-partner/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend-partner
        run: npm ci

      - name: Run tests
        working-directory: ./frontend-partner
        run: npm test -- --run

      - name: Build
        working-directory: ./frontend-partner
        run: npm run build:check
        env:
          VITE_API_BASE: https://api.flotteq.fr

  # Frontend Driver Build
  frontend-driver-build:
    name: Frontend Driver - Tests & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-driver/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend-driver
        run: npm ci

      - name: Run tests
        working-directory: ./frontend-driver
        run: npm test -- --run

      - name: Build
        working-directory: ./frontend-driver
        run: npm run build
        env:
          VITE_API_BASE: https://api.flotteq.fr
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_dummy_for_build

  # Frontend Internal Build
  frontend-internal-build:
    name: Frontend Internal - Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-internal/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend-internal
        run: npm ci

      - name: Run tests
        working-directory: ./frontend-internal
        run: npm test -- --run

      - name: Build
        working-directory: ./frontend-internal
        run: npm run build
        env:
          VITE_API_BASE: https://api.flotteq.fr
          VITE_UMAMI_DASHBOARD_URL: https://analytics.flotteq.fr

  frontend-landing-build:
    name: Frontend Landing - Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-landing/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend-landing
        run: npm ci
      - name: Run tests
        working-directory: ./frontend-landing
        run: npm test -- --run
      - name: Build
        working-directory: ./frontend-landing
        run: npm run build
        env:
          VITE_API_BASE: https://api.flotteq.fr
          VITE_UMAMI_HOST_URL: https://analytics.flotteq.fr
          VITE_UMAMI_WEBSITE_ID: 11111111-2222-3333-4444-555555555555

  frontend-portal-build:
    name: Frontend Portal - Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-portal/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend-portal
        run: npm ci
      - name: Build
        working-directory: ./frontend-portal
        run: npm run build

  # Docker Build Test
  docker-build-test:
    name: Docker - Build Test
    runs-on: ubuntu-latest
    needs: [backend-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22 for deployment tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Umami bootstrap
        run: node --test scripts/bootstrap-umami.test.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate production compose file
        env:
          UMAMI_DB_PASSWORD: test_umami_db_password
          UMAMI_APP_SECRET: test_umami_app_secret
          UMAMI_TWO_FACTOR_ENCRYPTION_KEY: 1111111122222222333333334444444455555555666666667777777788888888
        run: docker compose -f docker-compose.production.yml config --quiet

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: flotteq-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend-client image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-client
          file: ./frontend-client/Dockerfile
          push: false
          tags: flotteq-frontend-client:test
