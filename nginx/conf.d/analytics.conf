# Umami Analytics - analytics.flotteq.fr
upstream umami_analytics {
    server umami:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name analytics.flotteq.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name analytics.flotteq.fr;

    ssl_certificate /etc/letsencrypt/live/flotteq.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flotteq.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/analytics_access.log main;
    error_log /var/log/nginx/analytics_error.log warn;

    location / {
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://umami_analytics;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-Region-Code $http_cf_region_code;
        proxy_set_header CF-IPCity $http_cf_ipcity;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
